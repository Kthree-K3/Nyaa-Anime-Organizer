<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyaa Anime Organizer</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <div class="header-top">
                <h1><i class="fas fa-box-open"></i> Nyaa Anime Organizer</h1>
            </div>
            
            <div class="controls">
                <div class="filter-group">
                    <div class="select-wrapper">
                        <select id="dateRange">
                            <option value="24h">Last 24 hours</option>
                            <option value="today" selected>Today</option>
                            <option value="2d">Last 2 days</option>
                            <option value="3d">Last 3 days</option>
                            <option value="4d">Last 4 days</option>
                            <option value="5d">Last 5 days</option>
                            <option value="6d">Last 6 days</option>
                            <option value="7d">Last 7 days</option>
                        </select>
                    </div>
                    <button id="btnScan" class="btn-primary">
                        <i class="fas fa-sync-alt" id="scan-icon"></i> 
                        <span id="btnText">Start scanning</span>
                    </button>
                </div>

               

                <!-- لیست انیمه‌های من -->
                <div class="toggle-wrapper">
                    <label class="switch">
                        <input type="checkbox" id="myListFilter" checked>
                        <span class="slider"></span>
                    </label>
                    <button id="btnOpenMyList" class="btn-text-only"><i class="fas fa-list-ul"></i> My Anime List</button>
                </div>

                <div class="search-wrapper ltr-content">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search anime name..." disabled>
                    <i class="fas fa-times-circle clear-icon" id="clearSearch" style="display: none;"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="log-section">
            <div class="log-window">
                <div class="log-header">
                    <span><i class="fas fa-terminal"></i> Activity Log</span>
                    <button onclick="document.getElementById('debug-console').innerHTML=''"><i class="fas fa-eraser"></i> Clear</button>
                </div>
                <div id="debug-console" class="log-content"></div>
            </div>
        </section>

        <section id="anime-list" class="anime-grid ltr-content">
            <!-- محتوا توسط جاوااسکریپت ساخته می‌شود -->
        </section>
    </main>

    <footer class="main-footer" style="text-align: center; padding: 25px 0; border-top: 1px solid var(--border); margin-top: 40px; background-color: rgba(15, 23, 42, 0.4);">
        <div class="container">
            <a href="https://github.com/Kthree-K3/Nyaa-Anime-Organizer" target="_blank" class="github-footer-link" style="color: var(--text-dim); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: color 0.2s;">
                <i class="fab fa-github" style="font-size: 1.3rem;"></i>
                <span>Nyaa Anime Organizer on GitHub</span>
            </a>
        </div>
    </footer>

   <!-- پاپ‌آپ جدید (Modal) برای لیست انیمه‌های من -->
    <div id="myListModal" class="modal">
        <div class="modal-content ltr-content" style="max-width: 500px; height: 80vh; display: flex; flex-direction: column;">
            <div class="modal-header">
    <h3 style="display:flex; align-items:center; gap:10px; margin:0;">
        <i class="fas fa-list-ul"></i> My Anime List
        <!-- دکمه‌های جدید -->
        <button id="btnExportList" class="header-icon-btn" title="Export List" style="margin-left:10px; color:var(--primary);">
    <i class="fas fa-upload"></i>
</button>
<button id="btnImportList" class="header-icon-btn" title="Import List" style="color:var(--success);">
    <i class="fas fa-download"></i>
</button>
        <!-- ورودی مخفی فایل برای ایمپورت -->
        <input type="file" id="importFileInput" style="display:none" accept=".json">
    </h3>
    <span class="close-modal" id="btnCloseMyList">&times;</span>
</div>
            
            <!-- بخش جستجو و افزودن -->
            <div style="padding-bottom: 15px; border-bottom: 1px solid var(--border); margin-bottom: 15px;">
                <div class="search-wrapper" style="display: flex; gap: 10px; position: relative;">
    <div style="position: relative; flex: 1;">
        <input type="text" id="myListSearchInput" placeholder="Add new anime..." style="width: 100%; border-radius: 8px; padding-right: 35px;">
        <!-- آیکون ضربدر برای پاک کردن -->
        <i class="fas fa-times-circle" id="clearMyListSearch" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--error); cursor: pointer; display: none;"></i>
    </div>
    <button id="btnSearchForList" class="btn-primary" style="padding: 10px 15px; border-radius: 8px;">
        <i class="fas fa-plus"></i>
    </button>
</div>
                <!-- نتایج جستجو اینجا میاد -->
                <div id="myListSearchResults" class="my-list-results"></div>
            </div>

            <!-- لیست انیمه‌های ذخیره شده -->
            <div style="flex: 1; overflow-y: auto;">
                <h4 style="margin: 0 0 10px 0; color: var(--text-dim); font-size: 0.9rem;">Watchlist Items:</h4>
                <div id="myListContainer" class="my-list-grid">
                    <!-- آیتم‌های ذخیره شده اینجا میان -->
                </div>
            </div>

           
        </div>
    </div>

<div id="animeInfoModal" class="modal">
        <div class="modal-content ltr-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3 style="display: flex; align-items: center; gap: 10px; margin: 0;">
    <img src="favicon-anilist.png" alt="AL" style="width: 24px; height: 24px;">
    Anime Info
</h3>
                <span class="close-modal" id="btnCloseAnimeInfo">&times;</span>
            </div>
            
            <div class="search-wrapper" style="margin-bottom: 15px; display: flex; gap: 10px;">
                <input type="text" id="aniListSearchInput" placeholder="Edit title to search..." style="flex: 1; border-radius: 8px;">
                <button id="btnSearchAniList" class="btn-primary" style="padding: 10px 15px; border-radius: 8px;">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div id="aniListContent" style="min-height: 200px; max-height: 60vh; overflow-y: auto; padding-right: 5px;">
            </div>
        </div>
    </div>
</body>
</html>
